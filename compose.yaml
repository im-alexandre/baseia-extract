services:
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  mineru-api:
    image: baseia/mineru-api:${MINERU_IMAGE_TAG:-3.4.4}
    restart: unless-stopped
    build:
      context: ./infra/mineru
      dockerfile: Dockerfile
    environment:
      MINERU_VERSION: ${MINERU_VERSION:-3.4.4}
      PORT: "8000"
    ports:
      - "${MINERU_API_PORT:-8000}:8000"
    volumes:
      - mineru-models:/opt/mineru/models
      - mineru-results:/workspace/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

volumes:
  minio-data:
  mineru-models:
  mineru-results:
