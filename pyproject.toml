[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baseia-extract"
version = "0.1.0"
description = "Camada de extração documental do BaseIA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiofiles",
  "aiohttp",
  "bibtexparser==2.0.0b9",
  "httpx",
  "pandas",
  "pillow",
  "poethepoet>=0.38",
  "pyarrow",
  "pydantic",
  "pypdf[crypto]>=6.14.2",
  "requests",
  "tqdm",
  "unpywall",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baseia_extract"]

[tool.poe.tasks.inventory]
help = "Cria o manifesto completo de uma coleção de PDFs."
script = "baseia_extract.inventory:build_inventory(corpus_dir or None, output or None, workers or None, recursive)"
args = [
  { name = "corpus_dir", options = ["--corpus"], default = "" },
  { name = "output", options = ["--output"], default = "" },
  { name = "workers", options = ["--workers"], type = "integer", default = 0 },
  { name = "recursive", options = ["--recursive"], type = "boolean", default = true },
]

[tool.poe.tasks.sample]
help = "Gera uma amostra reprodutível do manifesto da coleção."
script = "baseia_extract.inventory:sample_inventory(size, source or None, output or None, seed)"
args = [
  { name = "size", options = ["--size"], type = "integer", default = 100 },
  { name = "source", options = ["--source"], default = "" },
  { name = "output", options = ["--output"], default = "" },
  { name = "seed", options = ["--seed"], type = "integer", default = 42 },
]

[tool.poe.tasks.extract]
help = "Executa a extração MinerU distribuída nos pods configurados."
script = "baseia_extract.mineru:extract(manifest or None, output or None, workers_per_pod or None, retries if retries >= 0 else None, overwrite, limit or None)"
args = [
  { name = "manifest", options = ["--manifest"], default = "" },
  { name = "output", options = ["--output"], default = "" },
  { name = "workers_per_pod", options = ["--workers-per-pod"], type = "integer", default = 0 },
  { name = "retries", options = ["--retries"], type = "integer", default = -1 },
  { name = "overwrite", options = ["--overwrite"], type = "boolean", default = false },
  { name = "limit", options = ["--limit"], type = "integer", default = 0 },
]
