[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baseia-extract"
version = "0.1.0"
description = "Camada de extração documental do BaseIA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiofiles",
  "aiohttp",
  "bibtexparser==2.0.0b9",
  "httpx",
  "pandas",
  "pillow",
  "pyarrow",
  "pydantic",
  "pypdf[crypto]>=6.14.2",
  "requests",
  "tqdm",
  "unpywall",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baseia_extract"]

[tool.poe.tasks.inventory]
help = "Inventaria todos os PDFs de corpus/ em data/inventory/inventory.csv."
script = "baseia_extract.inventory:build_inventory(workers or None, recursive)"
args = [
  { name = "workers", options = ["--workers"], type = "integer", default = 0 },
  { name = "recursive", options = ["--recursive"], type = "boolean", default = true },
]

[tool.poe.tasks.sample]
help = "Gera uma amostra reprodutível em data/inventory/sample.csv."
script = "baseia_extract.inventory:sample_inventory(size, seed)"
args = [
  { name = "size", options = ["--size"], type = "integer", default = 100 },
  { name = "seed", options = ["--seed"], type = "integer", default = 42 },
]

[tool.poe.tasks.extract]
help = "Cria pods temporários, extrai todo o manifesto e encerra os pods ao final."
script = "baseia_extract.tasks:extract()"
