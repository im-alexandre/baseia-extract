[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baseia-extract"
version = "0.1.0"
description = "Camada de extração documental do BaseIA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiofiles",
  "aiohttp",
  "anyio>=4.11,<5",
  "bibtexparser==2.0.0b9",
  "httpx",
  "markdownify>=1.2,<2",
  "pandas",
  "pdfplumber>=0.11,<1",
  "pillow",
  "pyarrow",
  "pydantic",
  "pypdf[crypto]>=6.14.2",
  "requests",
  "rich>=14,<15",
  "runpod>=1.9,<2",
  "tenacity>=9,<10",
  "tabulate>=0.9,<1",
  "tqdm",
  "unpywall",
  "mineru-client",
  "minio>=7.2,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baseia_extract"]

[tool.poe.tasks.inventory]
help = "Inventaria todos os PDFs de corpus/ em data/inventory/inventory.csv."
script = "baseia_extract.inventory:build_inventory(workers or None, recursive)"
args = [
  { name = "workers", options = ["--workers"], type = "integer", default = 0 },
  { name = "recursive", options = ["--recursive"], type = "boolean", default = true },
]

[tool.poe.tasks.sample]
help = "Gera uma amostra reprodutível em data/inventory/sample.csv."
script = "baseia_extract.inventory:sample_inventory(size, seed)"
args = [
  { name = "size", options = ["--size"], type = "integer", default = 100 },
  { name = "seed", options = ["--seed"], type = "integer", default = 42 },
]

[tool.poe.tasks.extract]
help = "Executa a extração no terminal; aceita add, scale, stop, status, log e watch."
script = "baseia_extract.tasks:extract(action, pods, workers)"
args = [
  { name = "action", positional = true, default = "start", choices = ["start", "add", "scale", "stop", "status", "log", "watch"] },
  { name = "pods", positional = true, multiple = true },
  { name = "workers", options = ["--workers"], type = "integer", default = 0 },
]

[tool.poe.tasks.ingest]
help = "Inicia a extração ou adiciona um pod com capacidade explícita."
script = "baseia_extract.tasks:ingest(pod_id, workers)"
args = [
  { name = "pod_id", positional = true },
  { name = "workers", options = ["--workers"], type = "integer" },
]

[tool.poe.tasks.recover-extract]
help = "Recupera ZIPs de tarefas MinerU concluídas sem reenviar PDFs."
script = "baseia_extract.recover:recover(pods, downloads, apply)"
args = [
  { name = "pods", positional = true, multiple = true },
  { name = "downloads", options = ["--downloads"], type = "integer", default = 4 },
  { name = "apply", options = ["--apply"], type = "boolean", default = false },
]

[tool.poe.tasks.audit]
help = "Audita o inventário e, quando existir, toda a extração MinerU."
script = "baseia_extract.audit:audit()"

[tool.poe.tasks.render]
help = "Gera IR, estrutura e Markdown semântico dos middle.json disponíveis."
script = "baseia_extract.render:render(workers, overwrite)"
args = [
  { name = "workers", options = ["--workers"], type = "integer", default = 0 },
  { name = "overwrite", options = ["--overwrite"], type = "boolean", default = false },
]

[tool.uv.sources]
mineru-client = { git = "https://github.com/sergeyshmakov/mineru-runpod", rev = "17d4955b244ea4d4dca9a5f3c995c7988fbb0c63" }
